{% extends 'master.html' %}
{% load static %}

{% block title %} Students {% endblock title %}

{% block content %}

   <h2 class="animate__animated animate__bounce">Students</h2>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-8 ">
            <table class="table">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Score</th>
                </tr>
                {% for student in students %}

                    <tr>
                        <td>{{student.names}}</td>
                        <td>{{student.email}}</td>
                        <td>{{student.age}}</td>
                        <td>{{student.score}}</td>
                    </tr>

                {% endfor %}
                

            </table>

            
        </div>
    </div>
</div>

{% endblock content %}
